name: Notice from issue

# Drafts the notice asked for by a "Post a notice" issue as a pull request. It runs at once for an issue from
# someone with access to the repository, and for anyone else's once a maintainer labels the issue "approved".
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: notice-issue-${{ github.event.issue.number }}

jobs:
  draft:
    name: Draft the notice
    if: >-
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'notice') && (
        (github.event.action != 'labeled' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association)) ||
        (github.event.action == 'labeled' && github.event.label.name == 'approved')
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BRANCH: notice/issue-${{ github.event.issue.number }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Add the notice to notices.json
        id: add
        env:
          # Through the environment, never the command line: the body is whatever the issue's author wrote.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: node scripts/notice-from-issue.mjs

      - name: Open or update the pull request
        env:
          NOTICE_ID: ${{ steps.add.outputs.id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add notices.json
          git commit --message "Add notice $NOTICE_ID"
          git push --force origin "$BRANCH"

          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Add notice $NOTICE_ID" --body-file "$RUNNER_TEMP/notice-report.md"
          else
            gh pr edit "$BRANCH" --title "Add notice $NOTICE_ID" --body-file "$RUNNER_TEMP/notice-report.md"
          fi

      - name: Say what is wrong with the form
        if: failure() && steps.add.outcome == 'failure'
        run: gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/notice-report.md"
